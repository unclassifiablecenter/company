<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Your Agency</title>
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 2em;
      padding: 0;
      background-color: black;
      color: white;
    }
    img.card-img {
      max-width: 90%;
      height: auto;
      margin-top: 20px;
      animation: fadeSlideIn 0.5s ease-out;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #fff;
      color: black;
      cursor: pointer;
    }
    button:hover {
      background-color: #ddd;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #already-drawn {
      margin-top: 1em;
      font-style: italic;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Claim Your Agency</h1>
  <button id="drawBtn" onclick="drawCard()">Draw</button>
  <div id="result"></div>
  <div id="already-drawn" style="display: none;">Your agency has already been revealed.</div>

  <script>
    const cards = [
      "https://unclassifiablecenter.github.io/company/images/TheAncestralChannel.png",
      "https://unclassifiablecenter.github.io/company/images/ThePressWhisperer.png",
      "https://unclassifiablecenter.github.io/company/images/TheToken.png",
      "https://unclassifiablecenter.github.io/company/images/TheWhiteKnuckler.png"
      // Add more URLs here...
    ];

    function drawCard() {
      const index = Math.floor(Math.random() * cards.length);
      const url = cards[index];
      document.getElementById('result').innerHTML = `<img src="${url}" alt="Card" class="card-img">`;
      document.getElementById('drawBtn').style.display = 'none';
      document.getElementById('already-drawn').style.display = 'block';
    }
  </script>
</body>
</html>
