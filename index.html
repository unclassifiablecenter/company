<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Claim Your Agency</title>
  <style>
    body {
      font-family: Helvetica, sans-serif;
      margin: 0;
      padding: 2em;
      background-color: white;
      color: black;
      text-align: center;
      transition: background-color 1s ease, color 1s ease;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 1em;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #555;
    }

    #cards {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2em;
      margin-top: 2em;
    }

    .card {
      max-width: 90%;
      width: 300px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .footer {
      font-size: 0.8em;
      margin-top: 2em;
      color: white;
      opacity: 0;
      transition: opacity 2s ease;
    }

    @media (max-width: 767px) {
      #cards {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <h1 id="title">Claim Your Agency.</h1>
  <button id="drawBtn">Draw First Card</button>
  <div id="cards"></div>
  <div id="footer" class="footer">
    Company: a Megagame<br/>
    Center for Unclassifiable Technologies and Experiences (C.U.T.E.)
  </div>

  <script>
    const categories = {
      narrative: [
        'TheCassandra.png', 'ThePressWhisperer.png', 'ThePrism.png', 'TheReceiptHoarder.png', 'TheUnbrandable.png'
      ],
      social: [
        'TheChaosBroker.png', 'TheResilientJoker.png', 'TheToken.png', 'TheVanisher.png', 'TheVibeArchitect.png'
      ],
      creative: [
        'TheBasementAlchemist.png', 'TheCultLeader.png', 'TheDoneOne.png', 'TheRememberer.png', 'TheWhiteKnuckler.png'
      ],
      systemic: [
        'TheArchitectofElsewhere.png', 'TheGlue.png', 'TheQuietlyBlacklisted.png', 'TheRadicalonRetainer.png', 'TheUltimateNepoKid.png'
      ],
      spiritual: [
        'TheAncestralChannel.png', 'TheBoneListener.png', 'TheHolyFire.png', 'TheNightHollow.png', 'TheSoftPower.png'
      ]
    };

    const baseUrl = 'https://raw.githubusercontent.com/unclassifiablecenter/company/main/images/';
    const allCategories = Object.keys(categories);
    const cardsContainer = document.getElementById('cards');
    const drawBtn = document.getElementById('drawBtn');
    const title = document.getElementById('title');
    const footer = document.getElementById('footer');

    let drawCount = 0;
    let selectedCategories = [];

    function getRandomItem(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function drawCard() {
      if (drawCount === 0) {
        // Pick 3 unique random categories
        selectedCategories = [...allCategories].sort(() => 0.5 - Math.random()).slice(0, 3);
      }

      const category = selectedCategories[drawCount];
      const cardImage = getRandomItem(categories[category]);
      const img = document.createElement('img');
      img.src = `${baseUrl}${category}/${cardImage}`;
      img.alt = cardImage;
      img.className = 'card';

      cardsContainer.appendChild(img);
      drawCount++;

      if (drawCount === 1) {
        drawBtn.textContent = 'Draw Second Card';
      } else if (drawCount === 2) {
        drawBtn.textContent = 'Draw Third Card';
      } else if (drawCount === 3) {
        drawBtn.remove();
        title.textContent = 'Your agency has been revealed.';
        document.body.style.backgroundColor = 'black';
        document.body.style.color = 'white';
        setTimeout(() => {
          footer.style.opacity = 1;
        }, 1000);
      }
    }

    drawBtn.addEventListener('click', drawCard);
  </script>
</body>
</html>
