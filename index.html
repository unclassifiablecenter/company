<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Your Agency</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Helvetica, Arial, sans-serif;
      font-weight: 300;
      background-color: white;
      color: black;
      transition: background-color 0.6s ease, color 0.6s ease;
    }

    body.revealed {
      background-color: black;
      color: white;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2em;
    }

    .text-block {
      margin-bottom: 1em;
    }

    img.card-img {
      max-width: 90%;
      height: auto;
      margin-top: 20px;
      animation: fadeSlideIn 0.5s ease-out;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      cursor: pointer;
      font-weight: 400;
    }

    button:hover {
      background-color: #555;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (min-width: 768px) {
      .container {
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
        max-width: 1000px;
        margin: 0 auto;
      }

      .text-block, #result {
        width: 50%;
        padding: 1em;
      }

      .text-block {
        text-align: left;
        margin-top: 4em;
      }

      #result {
        text-align: right;
      }

      img.card-img {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="text-block">
      <h1 id="title">Claim Your Agency</h1>
      <button id="drawBtn" onclick="drawCard()">Draw</button>
    </div>
    <div id="result"></div>
  </div>

  <script>
    const cards = [
      "https://unclassifiablecenter.github.io/company/images/TheAncestralChannel.png",
      "https://unclassifiablecenter.github.io/company/images/ThePressWhisperer.png",
      "https://unclassifiablecenter.github.io/company/images/TheToken.png",
      "https://unclassifiablecenter.github.io/company/images/TheWhiteKnuckler.png"
      // Add more URLs here...
    ];

    function drawCard() {
      const index = Math.floor(Math.random() * cards.length);
      const url = cards[index];

      document.getElementById('result').innerHTML = `<img src="${url}" alt="Card" class="card-img">`;
      document.getElementById('drawBtn').style.display = 'none';
      document.getElementById('title').textContent = "Your agency has been revealed.";
      document.body.classList.add('revealed');
    }
  </script>
</body>
</html>
