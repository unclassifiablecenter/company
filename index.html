<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw a Card</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin: 2em;
      padding: 0;
    }
    img {
      max-width: 90%;
      height: auto;
      margin-top: 20px;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>
  <h1>Draw Your Card</h1>
  <button onclick="drawCard()">Draw</button>
  <div id="result"></div>

  <script>
    const cards = [
      "https://raw.githubusercontent.com/unclassifiablecenter/company/main/images/TheAncestralChannel.png",
      "https://raw.githubusercontent.com/unclassifiablecenter/company/main/images/ThePressWhisperer.png",
      "https://raw.githubusercontent.com/unclassifiablecenter/company/main/images/TheToken.png",
      "https://raw.githubusercontent.com/unclassifiablecenter/company/main/images/TheWhiteKnuckler.png"
      // Add more raw GitHub URLs here as needed
    ];

    function drawCard() {
      if (cards.length === 0) {
        document.getElementById('result').innerHTML = "All cards have been drawn.";
        return;
      }
      const index = Math.floor(Math.random() * cards.length);
      const url = cards.splice(index, 1)[0]; // remove from list
      document.getElementById('result').innerHTML = `<img src="${url}" alt="Card">`;
    }
  </script>
</body>
</html>
