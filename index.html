<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Draw a Card</title>
  <style>
    body {
      font-family: Helvetica, Arial, sans-serif;
      text-align: center;
      margin: 2em;
      padding: 0;
    }
    img.card-img {
      max-width: 90%;
      height: auto;
      margin-top: 20px;
      animation: fadeSlideIn 0.5s ease-out;
    }
    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background-color: #555;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <h1>Claim Your Agency...</h1>
  <button onclick="drawCard()">Draw a Card</button>
  <div id="result"></div>

  <script>
    const allCards = [
      "https://unclassifiablecenter.github.io/company/images/TheAncestralChannel.png",
      "https://unclassifiablecenter.github.io/company/images/ThePressWhisperer.png",
      "https://unclassifiablecenter.github.io/company/images/TheToken.png",
      "https://unclassifiablecenter.github.io/company/images/TheWhiteKnuckler.png"
      // Add more card URLs here...
    ];

    let cards = [...allCards];

    function drawCard() {
      if (cards.length === 0) {
        cards = [...allCards];
      }

      const index = Math.floor(Math.random() * cards.length);
      const url = cards.splice(index, 1)[0];
      document.getElementById('result').innerHTML = `<img src="${url}" alt="Card" class="card-img">`;
    }
  </script>
</body>
</html>
