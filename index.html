<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Your Agency</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: Helvetica, Arial, sans-serif;
      text-align: center;
      background-color: white;
      color: black;
      transition: background-color 0.5s ease, color 0.5s ease;
    }

    img.card-img {
      max-width: 90%;
      height: auto;
      margin-top: 20px;
      animation: fadeSlideIn 0.5s ease-out;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #555;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <h1 id="title">Claim Your Agency</h1>
  <button id="drawBtn" onclick="drawCard()">Draw</button>
  <div id="result"></div>

  <script>
    const cards = [
      "https://unclassifiablecenter.github.io/company/images/TheAncestralChannel.png",
      "https://unclassifiablecenter.github.io/company/images/ThePressWhisperer.png",
      "https://unclassifiablecenter.github.io/company/images/TheToken.png",
      "https://unclassifiablecenter.github.io/company/images/TheWhiteKnuckler.png"
      // Add more URLs here...
    ];

    function drawCard() {
      const index = Math.floor(Math.random() * cards.length);
      const url = cards[index];

      // Show card
      document.getElementById('result').innerHTML = `<img src="${url}" alt="Card" class="card-img">`;

      // Hide button
      document.getElementById('drawBtn').style.display = 'none';

      // Change title and background
      document.getElementById('title').textContent = "Your agency has already been revealed.";
      document.body.style.backgroundColor = "black";
      document.body.style.color = "white";
    }
  </script>
</body>
</html>
