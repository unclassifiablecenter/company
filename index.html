<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claim Your Agency</title>
  <style>
    body {
      font-family: Helvetica, sans-serif;
      background-color: white;
      text-align: center;
      margin: 0;
      padding: 2em;
    }
    #title {
      font-size: 2em;
      margin-bottom: 1em;
    }
    #drawButton {
      padding: 12px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      background-color: #000;
      color: white;
      cursor: pointer;
    }
    #drawButton:hover {
      background-color: #333;
    }
    .card-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 2em;
    }
    .card-container img {
      max-width: 300px;
      width: 100%;
      height: auto;
      margin: 10px;
      animation: fadeIn 1s ease-in;
    }
    #footer {
      margin-top: 2em;
      font-size: 0.8em;
      color: #333;
      display: none;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (max-width: 600px) {
      .card-container {
        flex-direction: column;
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div id="title">Claim Your Agency.</div>
  <button id="drawButton" onclick="drawCard()">Draw</button>
  <div class="card-container" id="cardContainer"></div>
  <div id="footer">
    Company: a Megagame<br>
    Center for Unclassifiable Technologies and Experiences (C.U.T.E.)
  </div>

  <script>
    const base = "https://raw.githubusercontent.com/unclassifiablecenter/company/main/images";
    const categories = {
      creative: [
        "TheBasementAlchemist.png",
        "TheCultLeader.png",
        "TheDoneOne.png",
        "TheRememberer.png",
        "TheWhiteKnuckler.png"
      ],
      narrative: [
        "TheCassandra.png",
        "ThePressWhisperer.png",
        "ThePrism.png",
        "TheReceiptHoarder.png",
        "TheUnbrandable.png"
      ],
      social: [
        "TheChaosBroker.png",
        "TheResilientJoker.png",
        "TheToken.png",
        "TheVanisher.png",
        "TheVibeArchitect.png"
      ],
      spiritual: [
        "TheAncestralChannel.png",
        "TheBoneListener.png",
        "TheHolyFire.png",
        "TheNightHollow.png",
        "TheSoftPower.png"
      ],
      systemic: [
        "TheArchitectofElsewhere.png",
        "TheGlue.png",
        "TheQuietlyBlacklisted.png",
        "TheRadicalonRetainer.png",
        "TheUltimateNepoKid.png"
      ]
    };

    let drawn = 0;
    let usedCategories = [];

    function drawCard() {
      if (drawn >= 3) return;

      // Pick a random category not yet used
      const availableCategories = Object.keys(categories).filter(c => !usedCategories.includes(c));
      const category = availableCategories[Math.floor(Math.random() * availableCategories.length)];
      usedCategories.push(category);

      const images = categories[category];
      const card = images[Math.floor(Math.random() * images.length)];
      const url = `${base}/${category}/${card}`;

      const img = document.createElement('img');
      img.src = url;
      img.alt = card.replace(/\.png$/, '');
      document.getElementById('cardContainer').appendChild(img);

      drawn++;

      if (drawn === 3) {
        document.getElementById('drawButton').remove();
        document.getElementById('title').innerText = "Your agency has been revealed.";
        document.body.style.backgroundColor = "black";
        document.getElementById('title').style.color = "white";
        document.getElementById('footer').style.display = "block";
        document.getElementById('footer').style.color = "white";
      }
    }
  </script>
</body>
</html>
